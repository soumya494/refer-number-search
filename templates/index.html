<!DOCTYPE html>
<html lang="en">
<style>

/* =========================
   RESULT SECTION
========================= */

#result {
    width: 100%;
    margin-top: 28px;
    box-sizing: border-box;
}

.success-message {
    width: 100%;
    box-sizing: border-box;
    padding: 22px 18px;
    text-align: center;
    background: linear-gradient(135deg, #f2fff7, #e9fff1);
    border: 1px solid #b8e8ca;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0, 120, 60, 0.08);
    animation: resultShow 0.3s ease;
}

.success-message .status-icon {
    width: 44px;
    height: 44px;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #dcf8e8;
    color: #159447;
    font-size: 25px;
    font-weight: 700;
}

.success-message .status-title {
    margin-bottom: 7px;
    font-size: 17px;
    font-weight: 600;
    color: #176b3a;
}

.success-message .status-text {
    font-size: 19px;
    font-weight: 700;
    color: #111;
    line-height: 1.5;
}

.not-found-message {
    width: 100%;
    box-sizing: border-box;
    padding: 22px 18px;
    text-align: center;
    background: linear-gradient(135deg, #fff5f5, #fffafa);
    border: 1px solid #ffd0d0;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(180, 0, 0, 0.06);
    animation: resultShow 0.3s ease;
}

.not-found-message .status-icon {
    width: 44px;
    height: 44px;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #ffe5e5;
    color: #e53935;
    font-size: 24px;
    font-weight: 700;
}

.not-found-message .status-title {
    margin-bottom: 7px;
    font-size: 17px;
    font-weight: 600;
    color: #c62828;
}

.not-found-message .status-text {
    font-size: 14px;
    color: #666;
    line-height: 1.5;
}

@keyframes resultShow {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Refer Number Search</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">

    <div class="card">

        <div class="icon">
            🔍
        </div>

        <h1>Check Referral Status</h1>

        <p>Search Referral Number</p>


        <div class="search-box">

            <input
                type="text"
                id="mobile"
                maxlength="10"
                placeholder="Enter 10-digit number"
                autocomplete="off"
                autofocus
            >

            <button id="searchBtn">
                Check Status
            </button>

        </div>


        <!-- Result -->
        <div id="result"></div>


    </div>

</div>


<script>

const mobileInput = document.getElementById("mobile");
const searchBtn = document.getElementById("searchBtn");
const result = document.getElementById("result");


// =========================
// SEARCH FUNCTION
// =========================

async function checkStatus() {

    const number = mobileInput.value.trim();


    // Validate number
    if (!/^\d{10}$/.test(number)) {

        result.innerHTML = `
            <div class="error-message">
                ❌ Please enter a valid 10-digit mobile number
            </div>
        `;

        return;
    }


    // Loading
    searchBtn.disabled = true;
    searchBtn.innerText = "Checking...";

    result.innerHTML = `
        <div class="loading-message">
            Checking referral status...
        </div>
    `;


    try {

        const response = await fetch("/search", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                number: number
            })

        });


        const data = await response.json();


        // =========================
        // NUMBER FOUND
        // =========================

        if (data.found) {

            result.innerHTML = `
                <div class="success-message">

                    <div class="status-icon">
                        ✓
                    </div>

                    <div class="status-title">
                        Referral Found
                    </div>

                    <div class="status-text">
                        Refer in ${data.status}
                    </div>

                </div>
            `;

        }


        // =========================
        // NUMBER NOT FOUND
        // =========================

        else {

            result.innerHTML = `
                <div class="not-found-message">

                    <div class="status-icon">
                        ✕
                    </div>

                    <div class="status-title">
                        Not Refer
                    </div>

                    <div class="status-text">
                        This number is not available in the referral data.
                    </div>

                </div>
            `;

        }


    } catch (error) {

        console.error(error);

        result.innerHTML = `
            <div class="error-message">
                ❌ Something went wrong. Please try again.
            </div>
        `;

    }


    searchBtn.disabled = false;
    searchBtn.innerText = "Check Status";

}


// =========================
// BUTTON CLICK
// =========================

searchBtn.addEventListener("click", checkStatus);


// =========================
// ENTER KEY
// =========================

mobileInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        checkStatus();

    }

});


// =========================
// ONLY NUMBERS ALLOWED
// =========================

mobileInput.addEventListener("input", function() {

    this.value = this.value.replace(/\D/g, "");

});

</script>


</body>

</html>
