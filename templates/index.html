<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Refer Number Search</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">

    <div class="card">

        <div class="icon">
            🔍
        </div>

        <h1>Check Referral Status</h1>

        <p>Search Referral Number</p>


        <div class="search-box">

            <input
                type="text"
                id="mobile"
                maxlength="10"
                placeholder="Enter 10-digit number"
                autocomplete="off"
                autofocus
            >

            <button id="searchBtn">
                Check Status
            </button>

        </div>


        <!-- Result -->
        <div id="result"></div>


    </div>

</div>


<script>

const mobileInput = document.getElementById("mobile");
const searchBtn = document.getElementById("searchBtn");
const result = document.getElementById("result");


// =========================
// SEARCH FUNCTION
// =========================

async function checkStatus() {

    const number = mobileInput.value.trim();


    // Validate number
    if (!/^\d{10}$/.test(number)) {

        result.innerHTML = `
            <div class="error-message">
                ❌ Please enter a valid 10-digit mobile number
            </div>
        `;

        return;
    }


    // Loading
    searchBtn.disabled = true;
    searchBtn.innerText = "Checking...";

    result.innerHTML = `
        <div class="loading-message">
            Checking referral status...
        </div>
    `;


    try {

        const response = await fetch("/search", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                number: number
            })

        });


        const data = await response.json();


        // =========================
        // NUMBER FOUND
        // =========================

        if (data.found) {

            result.innerHTML = `
                <div class="success-message">

                    <div class="status-icon">
                        ✓
                    </div>

                    <div class="status-title">
                        Referral Found
                    </div>

                    <div class="status-text">
                        Refer in ${data.status}
                    </div>

                </div>
            `;

        }


        // =========================
        // NUMBER NOT FOUND
        // =========================

        else {

            result.innerHTML = `
                <div class="not-found-message">

                    <div class="status-icon">
                        ✕
                    </div>

                    <div class="status-title">
                        Not Refer
                    </div>

                    <div class="status-text">
                        This number is not available in the referral data.
                    </div>

                </div>
            `;

        }


    } catch (error) {

        console.error(error);

        result.innerHTML = `
            <div class="error-message">
                ❌ Something went wrong. Please try again.
            </div>
        `;

    }


    searchBtn.disabled = false;
    searchBtn.innerText = "Check Status";

}


// =========================
// BUTTON CLICK
// =========================

searchBtn.addEventListener("click", checkStatus);


// =========================
// ENTER KEY
// =========================

mobileInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        checkStatus();

    }

});


// =========================
// ONLY NUMBERS ALLOWED
// =========================

mobileInput.addEventListener("input", function() {

    this.value = this.value.replace(/\D/g, "");

});

</script>


</body>

</html>
